<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Inventario Lamiere</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace, monospace; margin: 0; padding: 0; }
    body { background-color: #05070a; color: #e2e8f0; padding: 15px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Login Box Terminal Style */
    #login-screen { max-width: 400px; margin: 80px auto; background: #0f172a; padding: 25px; border: 1px solid #334155; border-radius: 6px; box-shadow: 0 0 15px rgba(0, 255, 65, 0.1); }
    #login-screen h2 { margin-bottom: 15px; text-align: center; color: #38bdf8; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 10px; background: #020617; border: 1px solid #334155; color: #f8fafc; border-radius: 4px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #38bdf8; }

    /* Dashboard Header */
    header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; color: #fff; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .user-badge { font-size: 12px; background: #1e293b; color: #38bdf8; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; }
    
    /* Buttons */
    .btn { padding: 8px 12px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; font-family: inherit; text-transform: uppercase; transition: 0.15s; }
    .btn-primary { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger { background: #991b1b; color: #fca5a5; border-color: #ef4444; }
    .btn-danger:hover { background: #7f1d1d; }
    .btn-secondary { background: #334155; color: #cbd5e1; border-color: #475569; }
    .btn-secondary:hover { background: #1e293b; }
    .btn-info { background: #15803d; color: #86efac; border-color: #22c55e; }
    .btn-info:hover { background: #166534; }
    
    /* Controls & Search */
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .controls input, .controls select { padding: 10px; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 4px; font-size: 13px; font-family: inherit; }
    .controls input:focus { outline: none; border-color: #38bdf8; }
    
    /* Table */
    .table-responsive { background: #090d16; border: 1px solid #1e293b; border-radius: 6px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #1e293b; vertical-align: middle; }
    th { background: #0f172a; color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    tr:hover { background: #0f172a; }
    
    /* Colorazione per Materiale */
    .mat-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }
    .mat-ferro { color: #f87171; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
    .mat-inox { color: #60a5fa; background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; }
    .mat-alluminio { color: #4ade80; background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; }
    .mat-zincato { color: #9ca3af; background: rgba(156, 163, 175, 0.15); border: 1px solid #9ca3af; }

    /* Indicatori Giacenza Zero / Bassa */
    .zero-qty { background-color: rgba(153, 27, 27, 0.2) !important; }
    .zero-qty-badge { color: #fca5a5; font-weight: bold; }

    /* Quantity Controls */
    .qty-box { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; }
    .btn-qty { width: 30px; height: 30px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 13px; font-weight: bold; cursor: pointer; font-family: inherit; }
    .btn-qty:hover { background: #334155; border-color: #38bdf8; }
    
    /* Input variazione personalizzata */
    .custom-qty-input { width: 60px; padding: 5px; text-align: center; background: #020617; border: 1px solid #334155; color: #38bdf8; font-weight: bold; border-radius: 4px; font-size: 12px; font-family: inherit; }
    .custom-qty-input:focus { outline: none; border-color: #38bdf8; }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #0f172a; border: 1px solid #334155; padding: 20px; border-radius: 6px; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; color: #f8fafc; }
    .modal-content h3 { color: #38bdf8; font-size: 16px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <h2>[ ACCESS_CONTROL ]</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email Utente</label>
        <input type="email" id="login-email" required placeholder="utente@officina.local">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 5px;">ACCEDI AL TERMINALE</button>
      <p id="login-error" style="color: #f87171; font-size: 12px; margin-top: 10px; display: none; text-align: center;"></p>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display: none;">
    <header>
      <div>
        <h2 style="font-size: 16px; color: #38bdf8; letter-spacing: 1px;">MAGAZZINO LAMIERE</h2>
        <span class="user-badge" id="user-info">Caricamento...</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="btn-add-modal" class="btn btn-primary" onclick="openModal()">+ Nuova Lamiera</button>
        <button class="btn btn-info" onclick="openHistoryModal()">📜 Storico</button>
        <button onclick="logout()" class="btn btn-secondary">Esci</button>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="search-input" placeholder="Cerca materiale, spessore, note..." oninput="filterTable()" style="flex-grow: 1;">
      <select id="filter-material" onchange="filterTable()">
        <option value="">Tutti i Materiali</option>
        <option value="Ferro">Ferro</option>
        <option value="Inox">Inox</option>
        <option value="Alluminio">Alluminio</option>
        <option value="Zincato">Zincato</option>
      </select>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Materiale</th>
            <th>Spessore</th>
            <th>Formato</th>
            <th>Giacenza</th>
            <th>Variazione Rapida (+/-)</th>
            <th>Note / Spezzoni</th>
            <th>Ultimo Agg.</th>
            <th class="action-col">Azioni</th>
          </tr>
        </thead>
        <tbody id="inventory-list">
          <tr><td colspan="8" style="text-align: center; color: #64748b;">Connessione al database...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL FORM AGGIUNGI / MODIFICA -->
<div class="modal" id="item-modal">
  <div class="modal-content">
    <h3 id="modal-title">Aggiungi Lamiera</h3>
    <form id="item-form">
      <input type="hidden" id="item-id">
      <div class="form-group">
        <label>Materiale</label>
        <select id="item-materiale" required>
          <option value="Ferro">Ferro</option>
          <option value="Inox">Inox</option>
          <option value="Alluminio">Alluminio</option>
          <option value="Zincato">Zincato</option>
        </select>
      </div>
      <div class="form-group">
        <label>Spessore (mm)</label>
        <input type="number" step="0.1" id="item-spessore" required placeholder="es. 1.5">
      </div>
      <div class="form-group">
        <label>Formato (mm)</label>
        <input type="text" id="item-formato" required placeholder="es. 3000x1500">
      </div>
      <div class="form-group">
        <label>Quantità Fogli</label>
        <input type="number" id="item-quantita" required min="0" value="0">
      </div>
      <div class="form-group">
        <label>Note / Spezzoni (Opzionale)</label>
        <input type="text" id="item-note" placeholder="es. Pellicolato, 1 spezzone 1000x500">
      </div>
      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
        <button type="submit" class="btn btn-primary">Salva Scheda</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL STORICO MOVIMENTI -->
<div class="modal" id="history-modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3>📜 Storico Movimenti (Ultimi 50)</h3>
      <button class="btn btn-secondary" onclick="closeHistoryModal()">Chiudi</button>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Data/Ora</th>
            <th>Tipo</th>
            <th>Variazione</th>
            <th>Saldo</th>
            <th>Operatore</th>
          </tr>
        </thead>
        <tbody id="history-list">
          <tr><td colspan="5" style="text-align: center; color: #64748b;">Caricamento storico...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gfftjszhdpucvfqdtmxf.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmZnRqc3poZHB1Y3ZmcWR0bXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MjQwMDUsImV4cCI6MjEwODEwMDAwNX0.ujjN4qaqErL46znKe6cZ0k_zykDv-4hCqaZMlH52Lok";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let isReadOnly = false;
  let rawData = [];

  // Init Session
  window.onload = async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
      setupDashboard(session.user);
    }
  };

  // Login Handler
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      const errBox = document.getElementById('login-error');
      errBox.innerText = "ACCESSO NEGATO: Credenziali errate";
      errBox.style.display = 'block';
    } else {
      setupDashboard(data.user);
    }
  };

  async function logout() {
    await db.auth.signOut();
    location.reload();
  }

  function setupDashboard(user) {
    currentUser = user;
    const userRole = user.user_metadata?.role || 'viewer';
    isReadOnly = (userRole === 'viewer');
    
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    
    document.getElementById('user-info').innerText = `${user.email} [${isReadOnly ? 'SOLA LETTURA' : 'OPERATORE'}]`;

    if (isReadOnly) {
      document.getElementById('btn-add-modal').style.display = 'none';
      document.querySelectorAll('.action-col').forEach(el => el.style.display = 'none');
    }

    loadData();
  }

  // Carica i dati dal database
  async function loadData() {
    const { data, error } = await db.from('inventario').select('*').order('materiale', { ascending: true });
    if (!error) {
      rawData = data;
      renderTable(data);
    }
  }

  function renderTable(items) {
    const tbody = document.getElementById('inventory-list');
    tbody.innerHTML = '';

    if (items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #64748b;">Nessun materiale in archivio.</td></tr>';
      return;
    }

    items.forEach(item => {
      const tr = document.createElement('tr');
      if (item.quantita === 0) tr.classList.add('zero-qty');

      const dateStr = new Date(item.updated_at).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      // Badge colore per Materiale
      const matLower = item.materiale.toLowerCase();
      let matClass = 'mat-ferro';
      if (matLower.includes('inox')) matClass = 'mat-inox';
      else if (matLower.includes('alluminio')) matClass = 'mat-alluminio';
      else if (matLower.includes('zincato')) matClass = 'mat-zincato';

      let qtyDisplay = item.quantita === 0 
        ? `<span class="zero-qty-badge">0 (ESAURITO)</span>` 
        : `<strong style="font-size: 15px; color: #f8fafc;">${item.quantita}</strong>`;

      let qtyControls = isReadOnly 
        ? `<span style="color: #64748b;">-</span>` 
        : `<div class="qty-box">
             <button class="btn-qty" title="-1 foglio" onclick="changeQtyByDelta(${item.id}, -1)">-1</button>
             <button class="btn-qty" title="+1 foglio" onclick="changeQtyByDelta(${item.id}, 1)">+1</button>
             <input type="number" id="custom-delta-${item.id}" class="custom-qty-input" placeholder="± custom" onkeydown="if(event.key==='Enter') applyCustomDelta(${item.id})">
             <button class="btn btn-primary" style="padding: 5px 8px; font-size: 11px;" onclick="applyCustomDelta(${item.id})">OK</button>
           </div>`;

      let actionContent = isReadOnly ? '' : `
        <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="editItem(${item.id})">✏️</button>
        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="deleteItem(${item.id}, '${item.materiale} ${item.spessore_mm}mm')">🗑️</button>
      `;

      tr.innerHTML = `
        <td><span class="mat-badge ${matClass}">${item.materiale}</span></td>
        <td><strong style="color: #38bdf8;">${item.spessore_mm}</strong> mm</td>
        <td>${item.formato}</td>
        <td>${qtyDisplay}</td>
        <td>${qtyControls}</td>
        <td style="color: #cbd5e1;">${item.note || '-'}</td>
        <td style="font-size: 11px; color: #64748b;">${dateStr}</td>
        ${isReadOnly ? '' : `<td>${actionContent}</td>`}
      `;
      tbody.appendChild(tr);
    });
  }

  // Variazione Quantità singola (+1 / -1)
  async function changeQtyByDelta(id, delta) {
    if (isNaN(delta) || delta === 0) return;
    const item = rawData.find(i => i.id === id);
    if (!item) return;

    let newQty = item.quantita + delta;
    if (newQty < 0) newQty = 0;
    const actualDiff = newQty - item.quantita;
    if (actualDiff === 0) return;

    const { error } = await db.from('inventario')
      .update({ quantita: newQty, updated_at: new Date() })
      .eq('id', id);

    if (!error) {
      await db.from('storico_movimenti').insert({
        lamiera_id: id,
        tipo_operazione: actualDiff > 0 ? 'CARICO' : 'SCARICO',
        quantita_variata: actualDiff,
        quantita_risultante: newQty,
        operatore: currentUser.email
      });
      loadData();
    }
  }

  // Applica variazione numerica personalizzata (es. +10 o -5)
  function applyCustomDelta(id) {
    const inputEl = document.getElementById(`custom-delta-${id}`);
    if (!inputEl) return;
    const val = parseInt(inputEl.value);
    if (!isNaN(val) && val !== 0) {
      changeQtyByDelta(id, val);
      inputEl.value = '';
    }
  }

  // Eliminazione Scheda
  async function deleteItem(id, nomeLamiera) {
    if (confirm(`Confermi l'eliminazione definitiva di: ${nomeLamiera}?`)) {
      const { error } = await db.from('inventario').delete().eq('id', id);
      if (!error) loadData();
    }
  }

  // Filtro materiali e testo
  function filterTable() {
    const search = document.getElementById('search-input').value.toLowerCase();
    const matFilter = document.getElementById('filter-material').value;

    const filtered = rawData.filter(item => {
      const matchSearch = item.materiale.toLowerCase().includes(search) || 
                          item.spessore_mm.toString().includes(search) || 
                          item.formato.toLowerCase().includes(search) || 
                          (item.note && item.note.toLowerCase().includes(search));
      const matchMat = matFilter === '' || item.materiale === matFilter;
      return matchSearch && matchMat;
    });

    renderTable(filtered);
  }

  // Modal Gestione Schede
  function openModal() {
    document.getElementById('item-id').value = '';
    document.getElementById('item-form').reset();
    document.getElementById('modal-title').innerText = "Aggiungi Lamiera";
    document.getElementById('item-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('item-modal').style.display = 'none';
  }

  function editItem(id) {
    const item = rawData.find(i => i.id === id);
    if (!item) return;

    document.getElementById('item-id').value = item.id;
    document.getElementById('item-materiale').value = item.materiale;
    document.getElementById('item-spessore').value = item.spessore_mm;
    document.getElementById('item-formato').value = item.formato;
    document.getElementById('item-quantita').value = item.quantita;
    document.getElementById('item-note').value = item.note || '';

    document.getElementById('modal-title').innerText = "Modifica Scheda Lamiera";
    document.getElementById('item-modal').style.display = 'flex';
  }

  // Salva Form
  document.getElementById('item-form').onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById('item-id').value;
    const payload = {
      materiale: document.getElementById('item-materiale').value,
      spessore_mm: parseFloat(document.getElementById('item-spessore').value),
      formato: document.getElementById('item-formato').value,
      quantita: parseInt(document.getElementById('item-quantita').value),
      note: document.getElementById('item-note').value,
      updated_at: new Date()
    };

    if (id) {
      await db.from('inventario').update(payload).eq('id', id);
    } else {
      await db.from('inventario').insert(payload);
    }

    closeModal();
    loadData();
  };

  // Storico Movimenti Modal
  async function openHistoryModal() {
    document.getElementById('history-modal').style.display = 'flex';
    const tbody = document.getElementById('history-list');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b;">Lettura storico...</td></tr>';

    const { data, error } = await db.from('storico_movimenti')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(50);

    if (error || !data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b;">Nessun movimento trovato.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    data.forEach(m => {
      const dateStr = new Date(m.created_at).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const tr = document.createElement('tr');
      const isCarico = m.tipo_operazione === 'CARICO';
      const badgeColor = isCarico ? 'color: #4ade80;' : 'color: #f87171;';
      
      tr.innerHTML = `
        <td style="font-size: 11px; color: #94a3b8;">${dateStr}</td>
        <td style="${badgeColor} font-weight: bold;">${m.tipo_operazione}</td>
        <td><strong style="${badgeColor}">${m.quantita_variata > 0 ? '+' + m.quantita_variata : m.quantita_variata}</strong></td>
        <td><strong>${m.quantita_risultante}</strong></td>
        <td style="font-size: 11px; color: #64748b;">${m.operatore || '-'}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function closeHistoryModal() {
    document.getElementById('history-modal').style.display = 'none';
  }
</script>
</body>
</html>
